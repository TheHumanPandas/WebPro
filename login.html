<main class="container mt-5 flex-shrink-0">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 mt-4">
                <div class="card-header bg-warning text-dark text-center py-3">
                    <h3 class="h5 mb-0 fw-bold">Sisteme Giriş</h3>
                </div>
                <div class="card-body p-4">
                    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
                    
                    <form id="loginForm" action="login.php" method="POST" onsubmit="return validateLogin(event)">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Kullanıcı Adı (Öğrenci E-Posta)</label>
                            <input type="text" class="form-control" id="email" name="email" placeholder="Örn: b2412100001@sakarya.edu.tr">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Şifre (Öğrenci Numarası)</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Örn: b2412100001">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning fw-bold text-dark">Giriş Yap</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Eğer PHP'den yönlendirme ile ?error=1 parametresi gelirse hata mesajını göster
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('error') === '1') {
            const errorBox = document.getElementById('errorBox');
            errorBox.innerHTML = "<strong>Hata:</strong> Girdiğiniz kullanıcı adı veya şifre yanlış.";
            errorBox.classList.remove('d-none');
            
            // URL'deki parametreyi temizle (sayfa yenilenince hata mesajı gitsin diye)
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    });

    // Native JS ile form denetimi
    function validateLogin(event) {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('errorBox');
        let errors = [];

        // Boşluk Kontrolleri
        if (email === "") {
            errors.push("Kullanıcı adı (E-posta) alanı boş bırakılamaz.");
        } else {
            // Mail formatı kontrolü
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errors.push("Lütfen geçerli bir e-posta formatı giriniz.");
            }
        }

        if (password === "") {
            errors.push("Şifre alanı boş bırakılamaz.");
        }

        // Hata varsa göster ve formu durdur
        if (errors.length > 0) {
            errorBox.innerHTML = "<strong>Lütfen Hataları Düzeltin:</strong><br>" + errors.join("<br>");
            errorBox.classList.remove('d-none');
            event.preventDefault(); 
            return false;
        }

        // Sorun yoksa formu gönder
        errorBox.classList.add('d-none');
        return true;
    }
</script>
